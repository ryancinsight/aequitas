# mdBook configuration for the aequitas physical-quantity book.
# Build:  mdbook build docs/book      Serve:  mdbook serve docs/book
# The chapter Markdown lives alongside this file (src = "."); the table of
# contents and part structure are defined in SUMMARY.md.
[book]
title = "aequitas: Physical Quantities for the Atlas Stack"
authors = ["Ryan Clanton"]
description = "Dimensional analysis, canonical SI storage, and zero-overhead unit conversion for the Atlas simulation stack."
src = "."
language = "en"

[build]
build-dir = "../../target/book/aequitas"
create-missing = false

[output.html]
no-section-label = false
mathjax-support = true
site-url = "/aequitas/"
git-repository-url = "https://github.com/ryancinsight/aequitas"
edit-url-template = "https://github.com/ryancinsight/aequitas/edit/main/docs/book/{path}"
default-theme = "rust"
