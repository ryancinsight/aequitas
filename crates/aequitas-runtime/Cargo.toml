[package]
name = "aequitas-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Exact runtime SI dimensions for Aequitas quantities and buffers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/aequitas"

[dependencies]
# Match the static quantity identity exchanged by published Atlas providers.
aequitas = { version = "0.5.0", default-features = false }
eunomia = { version = "0.12.0", default-features = false }
num-rational = { version = "0.4", default-features = false, features = ["num-bigint"] }
num-bigint = { version = "0.4", default-features = false }
typenum = "1.20.1"

[dev-dependencies]
proptest = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[lints]
workspace = true
