[package]
name = "aequitas"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
description = "Atlas physical-quantity and dimensional-law foundation"
repository = "https://github.com/ryancinsight/aequitas"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["units", "dimensional-analysis", "simulation", "no-std"]
categories = ["no-std", "science"]

[dependencies]
eunomia = { version = "0.8.0", git = "https://github.com/ryancinsight/eunomia", default-features = false }
typenum = "1.20.1"
serde = { version = "1.0", default-features = false, optional = true }

[dev-dependencies]
proptest = "1.11.0"
uom = { version = "0.38.0", default-features = false, features = ["f32", "f64", "si", "std"] }

[features]
default = ["std"]
std = ["eunomia/std"]
serde = ["dep:serde"]

[workspace]
members = ["."]
default-members = ["."]
resolver = "3"

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

# Pedantic floor ratchet: every class listed below already fires in this
# workspace and is allowed at its measured baseline; every class NOT listed
# is a hard error. Counts are `cargo clippy --all-targets` hits at the time
# the floor was established (total / production, production excluding
# `#[cfg(test)]` modules and test, bench and example targets). Burn a class
# down to zero, then delete its line -- the floor tightens, never loosens.
#
# The ratchet is empty: a census over `--all-features`, default features and
# `--no-default-features`, across all targets, found 0 pedantic hits. The
# whole of `clippy::pedantic` is therefore a hard error here with no
# exceptions -- keep it that way.

# --- Restriction floor ---
# Aequitas is a library: an input-dependent `unwrap` is a panic in a consumer's
# process. Denied outright with no ratchet -- zero production sites.
unwrap_used = "deny"
# A library never writes to the process's stdio; output belongs to the caller.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[profile.dev]
debug = "line-tables-only"
overflow-checks = true

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
overflow-checks = true

[profile.release]
debug = false
strip = "symbols"
overflow-checks = true
