name: Deploy mdBook



on:

  push:

    branches: [main]

    paths:

      - "docs/book/**"
      # The book's samples compile against the crate, so a change
      # to the crate can break them without touching docs/book/.
      # 82ec9b5 did exactly that and the book stayed red, unseen,
      # for eight days.
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"

      - ".github/workflows/book-pages.yml"
      - "scripts/tests/test_book_pages_workflow.py"

  pull_request:

    paths:

      - "docs/book/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"

      - ".github/workflows/book-pages.yml"
      - "scripts/tests/test_book_pages_workflow.py"

  workflow_dispatch:
    inputs:
      publish:
        description: Publish Pages from main (requires publication authorization)
        type: boolean
        required: false
        default: false



permissions:

  contents: read



concurrency:

  # One group per ref: each pull request cancels its superseded runs, so a
  # rapid push series releases its queued runner slot in the account's
  # shared pool; default-branch runs still queue behind one another and never
  # cancel, since a half-cancelled deploy is worse than a superseded one and
  # concurrent deploys could publish an older commit after a newer one.
  group: book-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}



jobs:

  contract:
    name: Book publication contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install workflow parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify book publication contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_book_pages_workflow.py' -v

  deploy:

    needs: contract

    # Body owned once by Atlas (ADR 0035). Every run validates the book;

    # only a main-branch dispatch with publish selected authorizes Pages.

    # Existing Pages environment protection and permissions still apply.

    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@89f24d96c340ac0989145d058beececaac43a3ad

    permissions:

      contents: read

      pages: write

      id-token: write # OIDC Pages artifact flow; no deploy key.

    with:

      output-path: target/book/aequitas

      deploy: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish }}

      mdbook-test: true

      rust-toolchain: "1.97.0"

      cargo-package: aequitas
