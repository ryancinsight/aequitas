name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Runs first and alone: it needs no toolchain, no cache and no build, and it
  # guards the one artifact whose correctness cannot be checked from inside the
  # environment that produces it. Working on this repository inside the Atlas
  # stack puts a `[patch]` overlay on the path, under which cargo resolves every
  # first-party dependency to a local directory and writes a lock with all its
  # `source = "git+..."` lines stripped. That lock resolves fine locally and
  # fails every `--locked` job here, so the failure is invisible until CI.
  # Calls the shared Atlas workflow rather than copying the job, matching the
  # stack's existing shared-pipeline form (ADR 0035).
  lockfile:
    name: Lockfile integrity
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d
    permissions:
      contents: read

  semver:
    name: SemVer
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@806949a176cc139efe7c514d7e42c9b9a9447f45
    with:
      package: aequitas
    permissions:
      contents: read

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
      # The binding crate's tests embed an interpreter, so the workspace
      # gates below need one to link against.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify the committed lock graph
        shell: bash
        run: cargo metadata --locked --format-version 1 --all-features > /dev/null
      - name: Format
        run: cargo fmt --all -- --check
      - name: Feature check
        run: cargo check --locked --no-default-features
      # `--workspace` on every gate that must cover the binding crate:
      # `default-members` keeps a bare cargo command on the no_std law crate,
      # so without it these steps never compiled, linted or tested
      # `aequitas-python` -- the conversion sweep included.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Native tests
        run: cargo nextest run --locked --workspace --all-features
      - name: Documentation tests
        run: cargo test --locked --workspace --doc --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --all-features

  # The binding's own gate. Separate from `verify` because it needs a Python
  # interpreter and a wheel build, and because its distinctive failure -- a
  # quantity added upstream that never reached the generated inventory or the
  # stubs -- is invisible to a Rust-only job.
  bindings:
    name: Python bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Confirm the pinned toolchain is the one running
        # A committed `rust-toolchain.toml` outranks the action's own
        # selection, so the version is printed rather than assumed.
        run: rustc --version
      - name: Generated surface is current
        # Fails when an upstream quantity or unit never reached the inventory
        # or the stubs, which no Rust test can detect on its own.
        run: python scripts/generate-surface.py check
      - name: Install the build and check tools
        run: pip install "maturin>=1.9.4,<2.0" pytest mypy
      - name: Build and install the wheel
        working-directory: crates/aequitas-python
        run: maturin build --locked --release --out dist && pip install dist/*.whl
      - name: Python tests
        working-directory: crates/aequitas-python
        run: pytest tests -q
      - name: Wheel metadata renders
        working-directory: crates/aequitas-python
        run: pip install twine && twine check dist/*.whl

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
