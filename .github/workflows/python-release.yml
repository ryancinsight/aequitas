name: Python Release

# Builds, smoke-tests and publishes the `aequitas-python` distribution.
#
# The distribution is versioned apart from the workspace, so its releases
# carry their own tag, `aequitas-python-v<version>`; any other release event
# does nothing here. A pull request that edits this workflow or the package
# metadata runs everything except the publish, so the pipeline is proven where
# it changes rather than first on a release. The wheel matrix itself narrows
# to one platform on that PR proof run (below): the full 5-platform x 2-abi
# matrix seizes ten runners at once -- including the scarce macOS and Windows
# labels -- from the account's shared pool, and none of its cells are a
# required check, so a PR only needs one cell to prove the pipeline builds.
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/python-release.yml"
      - "crates/aequitas-python/pyproject.toml"

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.event.release.tag_name || github.ref }}
  # A half-cancelled publish is worse than a superseded one; a PR proof run
  # cancels its own superseded pushes so it never holds ten runner slots for
  # a commit nobody will look at again.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Release version
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'aequitas-python-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      wheel-matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Read the version and check the release tag against it
        id: read
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("crates/aequitas-python/Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          tag = os.environ.get("TAG", "")
          if os.environ["EVENT"] == "release" and tag != f"aequitas-python-v{version}":
              raise SystemExit(f"release tag {tag!r} does not name aequitas-python {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"aequitas-python {version}")
          PY
      - name: Plan the wheel matrix
        id: plan
        # The matrix context is unavailable in a job-level `if`, and narrowing
        # a static matrix through `include` re-adds unmatched rows as new
        # jobs, so the row set is computed here. A pull request proves the
        # pipeline builds with the one row that needs no cross-compiled or
        # scarce runner label; release and workflow_dispatch build all ten.
        # None of these rows is a required check.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os

          # abi3 serves every GIL build from 3.10; free-threaded CPython needs
          # a version-specific wheel until abi3t (3.15), which PyO3 supports
          # from 3.14. macos-15-intel is the last x86_64 macOS label Actions
          # publishes (macos-13 retired 2025-12-04); without it, pip on Intel
          # macOS falls back to the sdist and needs a Rust toolchain.
          platforms = [
              ("linux-x86_64", "ubuntu-latest", "x86_64"),
              ("linux-aarch64", "ubuntu-24.04-arm", "aarch64"),
              ("macos-arm64", "macos-14", "aarch64"),
              ("macos-x86_64", "macos-15-intel", "x86_64"),
              ("windows-x86_64", "windows-latest", "x64"),
          ]
          abis = [("abi3", "3.12", "python3.12"), ("free-threaded", "3.14t", "python3.14t")]
          rows = [
              {"platform": p, "runner": r, "target": t, "abi": a, "python": py, "interpreter": i}
              for p, r, t in platforms
              for a, py, i in abis
          ]
          if os.environ["EVENT"] == "pull_request":
              rows = [row for row in rows if row["platform"] == "linux-x86_64" and row["abi"] == "abi3"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": rows}) + "\n")
          print(json.dumps(rows, indent=2))
          PY

  wheels:
    name: Wheel (${{ matrix.platform }}, ${{ matrix.abi }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # A release matrix reports every target's failure in one run.
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.wheel-matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/aequitas-python
          target: ${{ matrix.target }}
          # The glibc floor for Linux wheels; ignored on other platforms.
          manylinux: "2014"
          args: --release --locked --out dist --interpreter ${{ matrix.interpreter }}
      - name: Smoke-test the wheel on its own platform
        shell: bash
        working-directory: crates/aequitas-python
        # The full Python suite against the installed wheel, not an import
        # alone. The type-checking tests skip: mypy is not installed here, and
        # CI's bindings job runs them.
        run: |
          python -m pip install pytest
          python -m pip install --no-index --find-links dist aequitas-python
          python -m pytest tests -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.abi }}
          path: crates/aequitas-python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Build the source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/aequitas-python
          command: sdist
          args: --out dist
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
      - name: Build and test from the source distribution
        shell: bash
        working-directory: crates/aequitas-python
        # A user without a matching wheel builds from this archive, so it must
        # carry everything the build needs -- the path dependency included.
        run: |
          python -m pip install pytest
          python -m pip install dist/*.tar.gz
          python -m pytest tests -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: crates/aequitas-python/dist/*.tar.gz
          if-no-files-found: error

  metadata:
    name: Distribution metadata
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Every artifact renders and carries valid metadata
        run: pipx run twine check --strict dist/*

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [version, metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/aequitas-python/${{ needs.version.outputs.version }}/
    permissions:
      # Trusted publishing: PyPI mints a short-lived token for this workflow
      # identity. No long-lived token exists to leak.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  published:
    name: Install from PyPI
    if: github.event_name == 'release'
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install the release from the index and run the suite
        shell: bash
        working-directory: crates/aequitas-python
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # The upload is visible on the simple index after a propagation delay,
        # so installation is retried a bounded number of times; the dry-run
        # gates above cannot see an upload-side fault, which is why this job
        # exists at all.
        run: |
          python -m pip install pytest
          for attempt in 1 2 3 4 5 6; do
            if python -m pip install --no-cache-dir "aequitas-python==${VERSION}"; then
              break
            fi
            [ "$attempt" = 6 ] && { echo "aequitas-python ${VERSION} never became installable"; exit 1; }
            sleep 30
          done
          python -m pytest tests -q
